<!DOCTYPE html>
<html>

<head>
	<title>{% block title %}loginForm!{% endblock %}</title>
	<style>
		body {
			text-align: center;
			font-size: 20px;
			margin:50px;
			color: rgb(25, 13, 6);
			background-color:rgb(201, 191, 177);
		}
		h3{
			font-size: 30px;
			text-decoration: underline;
			color:rgb(38, 38, 120);
		}
		h2{
			font-size: 40px;
			color:rgb(38, 38, 120);
		}
	</style>
</head>
<body>
	{% for message in get_flashed_messages() %}
    <p style="color: rgb(34, 34, 96);">{{ message }}</p>
	{% endfor %}
	{% if 'username' in session %}
	Logged in as {{ session['username'] }}, <a href="{{ url_for('logout') }}">click here to logout</a>
	<br />
	<br />
	{% endif %}
	{% block body %}
	{% endblock %}
</body>

</html>
